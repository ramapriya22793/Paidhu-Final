name: Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy-frontend:
    name: Deploy Frontend (paidhu.com)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Diagnostic Vercel Auth
        working-directory: ./frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          WHOAMI_OUT=$(vercel whoami --token="$VERCEL_TOKEN" 2>&1 || true)
          echo "::error title=VercelAuthDebug::Token length: ${#VERCEL_TOKEN}, Whoami: ${WHOAMI_OUT}"

      - name: Link and Pull Vercel Environment (Frontend)
        working-directory: ./frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_C2b0pSd5lkEwPzlzMXiZAQ1S
          VERCEL_PROJECT_ID: prj_HqL7cAuq6qR3bL94sLR3w1Wd58t3
        run: |
          mkdir -p .vercel
          echo '{"orgId":"team_C2b0pSd5lkEwPzlzMXiZAQ1S","projectId":"prj_HqL7cAuq6qR3bL94sLR3w1Wd58t3"}' > .vercel/project.json
          PULL_OUT=$(vercel pull --yes --environment=production --token="$VERCEL_TOKEN" 2>&1 || true)
          echo "::error title=VercelPullDebug::Pull output: ${PULL_OUT}"
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Run Vercel build (generate .vercel/output)
        working-directory: ./frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_C2b0pSd5lkEwPzlzMXiZAQ1S
          VERCEL_PROJECT_ID: prj_HqL7cAuq6qR3bL94sLR3w1Wd58t3
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Copy prebuilt output and project metadata to root
        run: |
          mkdir -p .vercel
          echo '{"orgId":"team_C2b0pSd5lkEwPzlzMXiZAQ1S","projectId":"prj_HqL7cAuq6qR3bL94sLR3w1Wd58t3"}' > .vercel/project.json
          cp -r frontend/.vercel/output .vercel/output

      - name: Deploy to Vercel Production (paidhu.com)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_C2b0pSd5lkEwPzlzMXiZAQ1S
          VERCEL_PROJECT_ID: prj_HqL7cAuq6qR3bL94sLR3w1Wd58t3
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

  deploy-backend:
    name: Deploy Backend API
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy Backend to Vercel (Production)
        working-directory: ./server
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_C2b0pSd5lkEwPzlzMXiZAQ1S
          VERCEL_PROJECT_ID: prj_fSwlGoKHjgTeFjyCLENapBP6lk3j
        run: |
          mkdir -p .vercel
          echo '{"orgId":"team_C2b0pSd5lkEwPzlzMXiZAQ1S","projectId":"prj_fSwlGoKHjgTeFjyCLENapBP6lk3j"}' > .vercel/project.json
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
