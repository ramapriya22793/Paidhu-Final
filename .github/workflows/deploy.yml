name: Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy-frontend:
    name: Deploy Frontend (paidhu.com)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy Frontend to Vercel
        working-directory: ./frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_C2b0pSd5lkEwPzlzMXiZAQ1S
          VERCEL_PROJECT_ID: prj_HqL7cAuq6qR3bL94sLR3w1Wd58t3
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice title=Vercel Deployment::VERCEL_TOKEN secret is not configured in GitHub repository secrets. If using automatic Vercel Git integration or manual redeploy from the Vercel dashboard, this is expected."
            exit 0
          fi
          mkdir -p .vercel
          echo '{"orgId":"team_C2b0pSd5lkEwPzlzMXiZAQ1S","projectId":"prj_HqL7cAuq6qR3bL94sLR3w1Wd58t3"}' > .vercel/project.json
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          mkdir -p ../.vercel
          echo '{"orgId":"team_C2b0pSd5lkEwPzlzMXiZAQ1S","projectId":"prj_HqL7cAuq6qR3bL94sLR3w1Wd58t3"}' > ../.vercel/project.json
          cp -r .vercel/output ../.vercel/output
          cd ..
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  deploy-backend:
    name: Deploy Backend API
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy Backend to Vercel
        working-directory: ./server
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_C2b0pSd5lkEwPzlzMXiZAQ1S
          VERCEL_PROJECT_ID: prj_fSwlGoKHjgTeFjyCLENapBP6lk3j
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice title=Vercel Backend::VERCEL_TOKEN secret is not configured in GitHub repository secrets."
            exit 0
          fi
          mkdir -p .vercel
          echo '{"orgId":"team_C2b0pSd5lkEwPzlzMXiZAQ1S","projectId":"prj_fSwlGoKHjgTeFjyCLENapBP6lk3j"}' > .vercel/project.json
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
